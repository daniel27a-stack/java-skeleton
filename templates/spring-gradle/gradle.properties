# Layers checked by archTest: controller, service, repository, client.
# archTest.excludeLayers lists the layers this artifact does not have (comma-separated);
# the rules tagged `layer-<layer>` are skipped for them. Unknown names fail the build.
# This service has controller and service layers only.
archTest.excludeLayers=repository,client

# Base of the registry that hosts the pirca libraries (host and owner, no trailing slash).
# This is the only place it is written: change this line to switch registry.
pirca.registryUrl=https://maven.pkg.github.com/daniel27a-stack
